<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-main">
                <div class="brand">
                    <i class="fas fa-calendar-alt"></i>
                    <h1>Jadwal Kuliah</h1>
                </div>
                <button id="themeToggle" class="theme-toggle">
                    <span class="theme-icon"></span>
                </button>
            </div>
            
            <div class="header-actions">
                <div class="search-container">
                    <input type="text" 
                           id="searchInput" 
                           class="search-input" 
                           placeholder="Cari mata kuliah, peserta, atau tanggal..."
                           aria-label="Pencarian jadwal">
                    <i class="fas fa-search"></i>
                </div>
                <nav class="filter-nav" id="filterNav" aria-label="Filter institusi"></nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Memuat Jadwal...</p>
        </div>

        <div class="schedule-grid" id="scheduleGrid"></div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-calendar-times empty-icon"></i>
            <h2 class="empty-title">Tidak Ada Jadwal Ditemukan</h2>
            <p class="empty-description">Coba gunakan kata kunci berbeda atau pilih filter lainnya</p>
        </div>
    </main>

    <!-- Participant Modal -->
    <div class="participant-modal" id="participantModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 class="modal-title" id="modalTitle"></h3>
            <div class="modal-schedules" id="modalSchedules"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
