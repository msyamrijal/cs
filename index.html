<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="header-top">
            <!-- Branding -->
            <div class="brand">
                <i class="fas fa-calendar-alt"></i>
                <h1>Jadwal Kuliah</h1>
            </div>

            <!-- Search and Filter -->
            <div class="search-filter">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Cari mata kuliah atau peserta...">
                    <i class="fas fa-search"></i>
                </div>
                <select id="institutionFilter" class="institution-filter">
                    <option value="all">Semua Institusi</option>
                </select>
            </div>

            <!-- Theme Toggle -->
            <button id="themeToggle" class="theme-toggle">
                <span class="theme-icon"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Memuat Jadwal...</p>
        </div>

        <!-- Schedule Grid -->
        <div class="schedule-grid" id="scheduleGrid"></div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-calendar-times"></i>
            <h3>Jadwal tidak ditemukan</h3>
            <p>Coba kata kunci atau filter berbeda</p>
        </div>
    </main>

    <!-- Modal Section -->
    <div class="modal" id="genericModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
