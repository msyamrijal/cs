<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="theme-overlay"></div>
    
    <header class="header">
        <div class="header-top">
            <div class="brand">
                <i class="material-icons">calendar_today</i>
                <h1>Jadwal Kuliah</h1>
            </div>
            <button id="themeToggle" class="theme-toggle">
                <i class="material-icons" id="modeIcon">dark_mode</i>
            </button>
        </div>
        
        <div class="header-bottom">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari jadwal...">
                <i class="material-icons">search</i>
            </div>
            <nav class="filter-nav" id="filterNav"></nav>
        </div>
    </header>

    <main class="main-content">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Memuat Jadwal...</p>
        </div>

        <div class="schedule-grid" id="scheduleGrid"></div>

        <div class="empty-state" id="emptyState">
            <i class="material-icons">calendar_today</i>
            <h3>Jadwal tidak ditemukan</h3>
            <p>Coba kata kunci atau filter berbeda</p>
        </div>
    </main>

    <div class="participant-modal" id="participantModal">
        <div class="modal-content">
            <span class="close-modal material-icons">close</span>
            <h3 id="modalTitle"></h3>
            <div class="modal-schedules" id="modalSchedules"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
