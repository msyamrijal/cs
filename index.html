<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Schedule</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Islamic Schedule</h1>
                <p>Your spiritual journey planner</p>
            </div>
            <div class="mosque-icon">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <path d="M12 2L2 7v2h2v10H2v2h20v-2h-2V9h2V7L12 2zm0 2.5L18 7v2h12v8H6V7l6-2.5zM6 19v-8h12v8H6z"/>
                </svg>
            </div>
        </header>

        <main>
            <div class="quran-verse">
                <h2>Quran Verse of the Day</h2>
                <p class="verse">"And We have not sent you, [O Muhammad], except as a mercy to the worlds."</p>
                <p class="reference">Quran 21:107</p>
            </div>

            <div class="prayer-times">
                <h2>Prayer Times</h2>
                <div class="prayer-grid">
                    <div class="prayer">
                        <span class="prayer-name">Fajr</span>
                        <span class="prayer-time">04:30</span>
                    </div>
                    <div class="prayer">
                        <span class="prayer-name">Dhuhr</span>
                        <span class="prayer-time">12:30</span>
                    </div>
                    <div class="prayer">
                        <span class="prayer-name">Asr</span>
                        <span class="prayer-time">15:45</span>
                    </div>
                    <div class="prayer">
                        <span class="prayer-name">Maghrib</span>
                        <span class="prayer-time">18:30</span>
                    </div>
                    <div class="prayer">
                        <span class="prayer-name">Isha</span>
                        <span class="prayer-time">20:00</span>
                    </div>
                </div>
            </div>

            <div class="schedule-section">
                <h2>Your Schedule</h2>
                <div id="scheduleGrid" class="schedule-grid">
                    <!-- Schedule items will be added here by JavaScript -->
                </div>
            </div>
        </main>

        <footer>
            <p>© 2024 Islamic Schedule. All rights reserved.</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
