<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Jadwal Kuliah</h1>
        <button id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="container">
        <input type="text" class="search-input" id="searchInput" placeholder="Cari jadwal...">
        <div class="grid" id="scheduleGrid"></div>
    </div>

    <!-- Modals -->
    <div class="modal" id="participantModal">
        <div class="modal-content">
            <h2 id="modalParticipantTitle"></h2>
            <div id="modalParticipantContent"></div>
            <button class="close-btn" onclick="closeModal('participantModal')">Tutup</button>
        </div>
    </div>

    <div class="modal" id="courseModal">
        <div class="modal-content">
            <h2 id="modalCourseTitle"></h2>
            <div id="modalCourseContent"></div>
            <button class="close-btn" onclick="closeModal('courseModal')">Tutup</button>
        </div>
    </div>

    <div class="modal" id="dateModal">
        <div class="modal-content">
            <h2 id="modalDateTitle"></h2>
            <div id="modalDateContent"></div>
            <button class="close-btn" onclick="closeModal('dateModal')">Tutup</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
